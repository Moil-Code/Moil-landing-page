# moilapp.com — compression, HSTS at the apex, and the HTTP/2 note.
#
# This file exists because the fix for the largest performance problem on the
# site lived only as a fenced code block in a markdown file, and had to be
# retyped by hand to be applied. It is now one file you can `include`, diff,
# and review like anything else in the repo.
#
# APPLY:
#   sudo cp docs/nginx/moilapp-performance.conf /etc/nginx/snippets/moilapp-performance.conf
#   # then inside the `server { … }` block for moilapp.com:
#   #     include snippets/moilapp-performance.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# VERIFY (must print a Content-Encoding line; before this change it printed nothing):
#   curl -sI -H 'Accept-Encoding: gzip, br' https://www.moilapp.com/_next/static/css/<hash>.css | grep -i content-encoding
#   curl -sI https://www.moilapp.com/business | head -1     # expect HTTP/2
#   curl -sI https://moilapp.com/ | grep -i strict-transport

# ── 1. Compression ────────────────────────────────────────────────────────────
# Measured Aug 2026 on the production build: all CSS + JS is 1,596 KB raw and
# 477 KB gzipped, a 71% cut. The largest stylesheet is 112 KB, render-blocking,
# and Lighthouse attributed 2,213 ms of blocked mobile render to it — almost all
# of that transfer time. nginx was serving /_next/static/** with no
# Content-Encoding at all, even when the client sent `Accept-Encoding: gzip, br`.
# Next.js gzips the HTML itself, which is why the documents looked fine and the
# assets did not.
gzip              on;
gzip_vary         on;          # so caches keep encoded and plain copies apart
gzip_comp_level   6;
gzip_min_length   256;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;
# Deliberately NOT in the list: jpeg, png, webp, avif, woff (pre-1.0 WOFF is
# already deflate-compressed). Re-compressing them costs CPU and saves nothing.

# Better still, if the ngx_brotli module is available: brotli for clients that
# accept it, gzip for the rest. Uncomment only after confirming the module is
# actually loaded (`nginx -V 2>&1 | grep -o brotli`) — these directives are a
# hard config error without it, and nginx will refuse to start.
# brotli            on;
# brotli_comp_level 5;
# brotli_types      text/plain text/css text/xml
#                   application/javascript application/json application/xml
#                   application/rss+xml image/svg+xml font/woff2;

# ── 2. HSTS at the apex ───────────────────────────────────────────────────────
# The Next app sends HSTS for www.moilapp.com (next.config.js). Per RFC 6797
# `includeSubDomains` only covers subdomains of the host that sent the header,
# so the www header does NOT reach blog / business / candidate.moilapp.com —
# they are siblings of www, not subdomains of it. Only the apex can cover all of
# *.moilapp.com, and the apex here is a redirect, not a route in the app.
#
# Put this in the `server` block that owns `moilapp.com` (the one that redirects
# to www), so the redirect response itself carries the policy.
#
# Before enabling: every *.moilapp.com host must genuinely serve HTTPS, because
# browsers will refuse plain HTTP to all of them for the full max-age. No
# `preload` — that submission is effectively irreversible.
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ── 3. HTTP/2 ─────────────────────────────────────────────────────────────────
# The origin answered HTTP/1.1 only, which Lighthouse costed at 1,040 ms:
# without multiplexing the browser is capped at ~6 connections per origin and
# everything queues behind the stylesheets. This belongs on the `listen`
# directive in the server block, not in an included snippet, so it is written
# here only as the line to change:
#
#   nginx >= 1.25.1:   listen 443 ssl;
#                      http2 on;
#   nginx 1.18:        listen 443 ssl http2;
#
# nginx 1.18 is also end-of-life; worth scheduling an upgrade for the security
# patches regardless of this file.
