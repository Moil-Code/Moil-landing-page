name: Tests

# Callable by the deploy workflow (`uses: ./.github/workflows/tests.yml`) and
# run on its own for every pull request. The deploy `needs:` this, so a red
# suite means nothing reaches the server.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Offline eval suite
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED, not a nicety. Some evals compare against
      # `origin/main` — and actions/checkout does a shallow, single-branch fetch
      # by default, so neither `origin/main` nor a local `main` exists and the
      # eval dies with `fatal: bad revision 'main'` before it can assert
      # anything. Fetching all refs is what lets those checks actually compare.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # `yarn install --frozen-lockfile` — NOT `npm ci`. The committed
      # package-lock.json is out of sync with package.json (missing
      # caniuse-lite) and react 19 conflicts with lucide-react's declared peer
      # range, so npm fails twice over. yarn.lock is in sync, and vercel.json
      # already declares yarn as this project's install command.
      # --frozen-lockfile REFUSES rather than quietly resolving a different
      # tree, which is what makes CI test what production will build.
      - name: Install
        run: yarn install --frozen-lockfile

      # The evals are offline and take under a second — no network, no build.
      # Do NOT export NEXT_PUBLIC_REGISTER_ORIGIN here: several evals pin the
      # unset-env fallback (production register) so a missing host env cannot
      # silently retarget www. The Build step is what bakes stagebeta origins.
      - name: Test
        run: yarn test

      # The build is the deploy's riskiest step and it is not covered by the
      # evals, so it runs here too: a commit that cannot compile should fail on
      # the PR rather than on the server, where the fallout is a rollback.
      #
      # STAGEBETA origins — do not bake production. Next inlines
      # NEXT_PUBLIC_* at build time; PLAN_API_ORIGIN is the server rewrite
      # target for same-origin /plan/preview. /api /plan /mail stay on Node
      # (nginx on stagebeta); Next only rewrites /plan/preview*.
      - name: Build
        env:
          PLAN_API_ORIGIN: https://stagebeta.moilapp.com
          NEXT_PUBLIC_REGISTER_ORIGIN: https://employer-beta.moilapp.com
        run: yarn build

      # Every defect in the Aug 2026 Semrush Site Audit was in RENDERED OUTPUT
      # that compiled fine and looked right: two Offer objects missing required
      # fields on all 65 pages, eight legal pages whose title was a styled <p>
      # so they had no h1 at all, three hreflang tags pointing at URLs that
      # canonicalise away. The evals could not see any of it and neither could
      # the build. This step boots the build and reads the HTML the way a
      # crawler does, with no JavaScript executed.
      #
      # It fails ONLY on the hard classes — invalid schema, missing/duplicate
      # h1, images without alt, broken hreflang clusters. Thin-content signals
      # are printed but never fail: they are a property of shipping a React app
      # and gating on them would be noise nobody reads.
      - name: SEO audit
        run: |
          # Actions runs this with `set -e`, so the audit's own non-zero exit is
          # what fails the step. Cleanup therefore has to be a trap: anything
          # written after the audit line would never run on the failing path,
          # which is the path that matters.
          PORT=3000 yarn start &
          # Capture the pid NOW. `$!` inside the trap body would be resolved
          # when the trap fires, by which point it names whatever background
          # job ran last — or nothing.
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/business && break
            sleep 2
          done
          # Fail with the real reason rather than letting the audit report 30
          # unreachable pages when the server simply never came up.
          curl -sf -o /dev/null http://127.0.0.1:3000/business \
            || { echo "::error::next start never became ready on :3000"; exit 1; }

          BASE=http://127.0.0.1:3000 yarn audit:seo
