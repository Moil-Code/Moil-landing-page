name: Tests

# Callable by the deploy workflow (`uses: ./.github/workflows/tests.yml`) and
# run on its own for every pull request. The deploy `needs:` this, so a red
# suite means nothing reaches the server.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Offline eval suite
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED, not a nicety. evals/spanishDoor.test.js
      # enforces the scope of a change by diffing the working tree against
      # `origin/main` — and actions/checkout does a shallow, single-branch fetch
      # by default, so neither `origin/main` nor a local `main` exists and the
      # eval dies with `fatal: bad revision 'main'` before it can assert
      # anything. That is a broken check, not a failing one: it would go red on
      # every PR regardless of content. Fetching all refs is what lets it
      # actually compare.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # `yarn install --frozen-lockfile` — NOT `npm ci`. The committed
      # package-lock.json is out of sync with package.json (missing
      # caniuse-lite) and react 19 conflicts with lucide-react's declared peer
      # range, so npm fails twice over. yarn.lock is in sync, and vercel.json
      # already declares yarn as this project's install command.
      # --frozen-lockfile REFUSES rather than quietly resolving a different
      # tree, which is what makes CI test what production will build.
      - name: Install
        run: yarn install --frozen-lockfile

      # The evals are offline and take under a second — no network, no build.
      - name: Test
        run: yarn test

      # The build is the deploy's riskiest step and it is not covered by the
      # evals, so it runs here too: a commit that cannot compile should fail on
      # the PR rather than on the server, where the fallout is a rollback.
      - name: Build
        run: yarn build
