name: Deploy to stagebeta

# STAGEBETA ONLY. This repo is Moil-Landing-Page-Staging.
# Do NOT deploy to www.moilapp.com / moilapp.com.
# Do NOT use the production landing SSM transport (Moil-landing-page /
# Moil-codeProdbackend). leftover-4 dest HOLD. leftover-6 OFF.
#
# Preferred transport: the same SSH pattern Business-plan-Staging uses to
# reach the stagebeta host (SERVER_SSH_KEY), piping `.github/deploy.sh`
# so the Next build / PM2 reload / health-check / rollback live in the repo.
#
# This workflow is workflow_dispatch-only on purpose. SERVER_SSH_KEY is not
# proven present on this repo (it was copied from the production landing
# SSM pipeline). A push-to-main trigger would either no-op on missing
# secrets or, worse, reuse leftover production SSM if that were still
# wired. CoS merges; a human dispatches deploy after the SSH secrets exist.
#
# Setup: DEPLOYMENT.md

on:
  workflow_dispatch:

# Never run two deploys at once — a second `git reset --hard` landing while
# the first is mid-install leaves node_modules describing one commit and the
# working tree another. `cancel-in-progress: false` because killing a deploy
# halfway through is worse than queueing behind it.
concurrency:
  group: deploy-landing-stagebeta
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy over SSH (stagebeta)
    needs: test
    runs-on: ubuntu-latest
    # Staging environment — never `production`. That name is what the
    # production landing OIDC subject uses; this job must not assume it.
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          missing=()
          [ -n "$SERVER_HOST" ]    || missing+=("SERVER_HOST")
          [ -n "$SERVER_USER" ]    || missing+=("SERVER_USER")
          [ -n "$SERVER_SSH_KEY" ] || missing+=("SERVER_SSH_KEY")
          [ -n "$APP_PATH" ]       || missing+=("APP_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Stagebeta SSH deploy is not configured. Missing secrets: ${missing[*]}"
            echo "This repo does not use production landing SSM. Add SERVER_SSH_KEY / SERVER_HOST / SERVER_USER / APP_PATH (the same names Business-plan-Staging uses) pointing at the STAGEBETA host. See DEPLOYMENT.md."
            exit 1
          fi
          case "$SERVER_HOST" in
            *www.moilapp.com*|moilapp.com)
              echo "::error::SERVER_HOST looks like production ($SERVER_HOST). This workflow is stagebeta-only."
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$SERVER_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "STRICT_HOST_KEY=yes" >> "$GITHUB_ENV"
            echo "Host key pinned from SERVER_KNOWN_HOSTS."
          else
            ssh-keyscan -p "$SSH_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "STRICT_HOST_KEY=accept-new" >> "$GITHUB_ENV"
            echo "::warning::SERVER_KNOWN_HOSTS is not set, so the host key was scanned at deploy time and trusted unverified. Pin it: run 'ssh-keyscan -p $SSH_PORT <host>' and paste the output into that secret."
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
          PM2_NAME: ${{ secrets.PM2_NAME }}
          SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:3000/business' }}
          DEPLOY_ROLLBACK: ${{ vars.DEPLOY_ROLLBACK || '1' }}
          PLAN_API_ORIGIN: https://stagebeta.moilapp.com
          NEXT_PUBLIC_REGISTER_ORIGIN: https://employer-beta.moilapp.com
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking="$STRICT_HOST_KEY" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              "$SERVER_USER@$SERVER_HOST" \
              "env APP_PATH='$APP_PATH' \
               PM2_NAME='$PM2_NAME' \
               DEPLOY_BRANCH='$DEPLOY_BRANCH' \
               DEPLOY_SHA='${{ github.sha }}' \
               HEALTH_URL='$HEALTH_URL' \
               DEPLOY_ROLLBACK='$DEPLOY_ROLLBACK' \
               PLAN_API_ORIGIN='$PLAN_API_ORIGIN' \
               NEXT_PUBLIC_REGISTER_ORIGIN='$NEXT_PUBLIC_REGISTER_ORIGIN' \
               bash -s" < .github/deploy.sh
          rc=$?

          if [ "$rc" -eq 255 ]; then
            echo "::error::SSH could not connect or authenticate. NOTHING on the server was touched — no pull, no reload, no rollback. Check SERVER_HOST / SERVER_USER / SERVER_SSH_KEY, and that this key's PUBLIC half is in the deploy user's ~/.ssh/authorized_keys on the STAGEBETA host. This is not production landing SSM."
          elif [ "$rc" -ne 0 ]; then
            echo "::error::The deploy ran on the stagebeta host and failed (exit $rc). Read the script output above: if the health check failed, it has already rolled back to the previous commit."
          fi
          exit "$rc"
